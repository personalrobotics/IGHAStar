# slot_rearrange (2 tees): peg-in-slot Push-T, two tees, one agent, closed box.
# Each slot is a pocket built from wall segments against a box edge. A tee goal has its
# stem in the pocket and its bar against the mouth wall.
# Epsilon is 8 px, 0.15 rad because the slot leaves about 5 px of clearance per side.
experiment_info_default:
  resolution: [40.0, 40.0, 40.0, 40.0, 0.5, 40.0, 40.0, 0.5, 50.0, 50.0, 50.0, 50.0, 0.5, 50.0, 50.0, 0.5]
  tolerance: [1.0, 1.0, 1.0, 1.0, 0.01, 1.0, 1.0, 0.01, 25.0, 25.0, 25.0, 25.0, 0.25, 25.0, 25.0, 0.25]
  epsilon: [1.0e9, 1.0e9, 8.0, 8.0, 0.15, 8.0, 8.0, 0.15, 1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9]
  division_factor: 2.0
  max_expansions: 100000
  hysteresis: 500
  node_info:
    node_type: "pusht_multi"
    n_substeps: 10
    workspace_lo: 0.0
    workspace_hi: 512.0
    agent_x_hi: 512.0
    num_tees: 2
    objective: rearrange
    max_agent_force: 150000.0
    open_right: false
    n_directions: 24
    action_radii: [200.0]
    max_agent_vel: 500.0
    max_penetration_px: 1.0
    dynamics: chipmunk
