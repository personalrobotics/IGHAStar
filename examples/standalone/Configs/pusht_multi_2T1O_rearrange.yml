# 2T1O_rearrange: two tees, one static square, closed box.
# Each tee has its own goal pose (body xy and angle). Tee index is the id.
# Color is not in the state. Render tee 0 blue and tee 1 orange.
# Knobs match pusht_ndir24. Epsilon matches single-T (20 px, 0.349 rad).
experiment_info_default:
  resolution: [40.0, 40.0, 40.0, 40.0, 0.5, 40.0, 40.0, 0.5, 50.0, 50.0, 50.0, 50.0, 0.5, 50.0, 50.0, 0.5]
  tolerance: [1.0, 1.0, 1.0, 1.0, 0.01, 1.0, 1.0, 0.01, 25.0, 25.0, 25.0, 25.0, 0.25, 25.0, 25.0, 0.25]
  epsilon: [1.0e9, 1.0e9, 20.0, 20.0, 0.349, 20.0, 20.0, 0.349, 1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9, 1.0e9]
  max_level: 3
  division_factor: 2.0
  max_expansions: 100000
  hysteresis: 500
  node_info:
    node_type: "pusht_multi"
    n_substeps: 10
    workspace_lo: 0.0
    workspace_hi: 512.0
    agent_x_hi: 512.0
    num_tees: 2
    num_obstacles: 1
    obstacle_side: 30.0
    objective: rearrange
    open_right: false
    n_directions: 24
    action_radii: [200.0]
    max_agent_vel: 500.0
    max_penetration_px: 1.0
    dynamics: chipmunk
