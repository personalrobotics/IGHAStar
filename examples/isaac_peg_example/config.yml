# IGHA* on UWLab OmniReset UR5e peg insertion (Isaac Sim). UNREVIEWED.
planner:  # experiment_info_default
  max_level: 4
  division_factor: 1.148698354997035
  max_expansions: 3000
  hysteresis: 400
  preemptive_expansion:
    enabled: true
    active_only: true
    min_preemptive: 3     # (1 + max_preemptive) * num_controls(64) = number of Isaac envs
    max_preemptive: 3

problem:  # PegConfig
  steps_per_edge: 5       # policy steps (0.1 s each) per edge -> 0.5 s
  num_controls: 64
  n_peg_rows: 8           # hand toward a random point on the peg
  n_hole_rows: 8          # hand (or held peg) toward the hole

task:
  resolution: [0.2, 0.2, 0.2, 0.5, 0.5, 0.5, 0.2, 0.2, 0.2, 0.5]
  tolerance:  [0.005, 0.005, 0.005, 0.05, 0.05, 0.05, 0.01, 0.01, 0.01, 0.1]
