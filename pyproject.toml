[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ighastar"
version = "0.1"
description = "IGHAStar path planning library and tools"
authors = [
    { name = "Sidharth Talia" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "opencv-python",
    "pyyaml"
]

[project.optional-dependencies]
# Synthetic ESDF generation and the Viser debugging views.
viz = [
    "scipy",
    "viser",
    "trimesh"
]

[tool.setuptools.packages.find]
include = ["ighastar*"]
exclude = ["Content*", "examples*", "scripts*"]

# Ship C++ headers / CUDA sources / vendored robin_hood for JIT extension builds.
[tool.setuptools.package-data]
ighastar = [
    "src/**/*.h",
    "src/**/*.hpp",
    "src/**/*.cpp",
    "src/**/*.cu",
    "third_party/robin_hood/*",
]